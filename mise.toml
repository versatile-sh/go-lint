[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
"go:github.com/mgechev/revive" = "1.17.1"

[tasks.lint-fast]
description = "Fast tier (pre-commit): goimports and revive on the files given"
run = "go run ./cmd/vlint fast -fix"

[tasks.lint]
description = "Changed tier (pre-push): config drift, then vlint and golangci-lint on the packages changed since origin/main"
run = [
  "git rev-parse -q --verify origin/main >/dev/null || git fetch -q origin main:refs/remotes/origin/main",
  "go run ./cmd/vlint golangci -check",
  "go run ./cmd/vlint changed",
]

[tasks.lint-full]
description = "Full tier: gofmt, go vet, config drift, vlint and golangci-lint on everything"
run = [
  "test -z \"$(gofmt -l .)\"",
  "go vet ./...",
  "go run ./cmd/vlint golangci -check",
  "go run ./cmd/vlint ./...",
  "golangci-lint run ./...",
]

[tasks.test]
description = "Race tests"
run = "go test -race -count=1 ./..."

[tasks.semgrep]
description = "Semgrep on the new findings since the merge base"
run = """
semgrep scan --metrics=off --disable-version-check --error --severity WARNING --severity ERROR \
  --config p/default --config p/secrets --config p/golang \
  --config https://raw.githubusercontent.com/versatile-sh/semgrep-rules/v0.1.2/rules/versatile.yml \
  --baseline-commit "$(git merge-base HEAD origin/main)"
"""

[tasks.check]
description = "Everything: the full lint tier, then Semgrep"
run = [{ task = "lint-full" }, { task = "semgrep" }]

[tasks.images]
description = "Regenerate the README images in docs/assets"
dir = "docs/assets/src"
run = "npm ci && node build-banners.mjs"
